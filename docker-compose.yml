version: '3.8'

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/db.sqlite
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-180}
      MAGIC_LINK_EXPIRY_MINUTES: ${MAGIC_LINK_EXPIRY_MINUTES:-15}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Reseboken <noreply@example.com>}
      STORAGE_PATH: /data/uploads
      PORT: 3000
      NODE_ENV: production
    volumes:
      - reseboken-data:/data
    labels:
      caddy: ${DOMAIN:-localhost}
      caddy.reverse_proxy: "{{upstreams 3000}}"

  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy-data:/data
    environment:
      CADDY_INGRESS_NETWORKS: reseboken_default

volumes:
  reseboken-data:
  caddy-data:
